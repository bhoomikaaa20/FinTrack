# Netlify settings for the frontend (the API is deployed separately on Render)
[build]
  base    = "client"
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  # @tanstack/react-start requires Node >= 22.12 (older Node fails the build)
  NODE_VERSION = "22"
  # Render API URL baked into the bundle at build time (client/.env is git-ignored)
  VITE_API_URL = "https://fintrack-cloud-jzp1.onrender.com"

# SPA fallback so deep links like /dashboard work on refresh
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
