# Netlify settings for the frontend (the API is deployed separately on Render)
[build]
  base    = "client"
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  # @tanstack/react-start requires Node >= 22.12 (older Node fails the build)
  NODE_VERSION = "22"
  # "/" makes the app call the API on its own origin (/api/...), which Netlify
  # proxies to Render — see client/public/_redirects
  VITE_API_URL = "/"

# Redirect and proxy rules live in client/public/_redirects (Netlify applies
# that file before netlify.toml, so keeping them in one place avoids conflicts).
